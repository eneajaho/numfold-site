<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Numfold — not found</title>
<meta name="robots" content="noindex">
<style>
  /* Self-contained: a 404 is served for any path, so it cannot rely on a relative stylesheet. */
  :root { --bg: #0B0F1A; --surface: #141A2A; --text: #F2F4F8; --muted: #8B93A7; --line: rgba(255,255,255,0.08); --amber: #F6B04B; --amber-ink: #F6B04B; }
  @media (prefers-color-scheme: light) { :root { --bg: #F5F6FA; --surface: #FFFFFF; --text: #0B0F1A; --muted: #5B6478; --line: rgba(11,15,26,0.08); --amber-ink: #9A5F06; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 600 16px/1.6 "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  main { text-align: center; padding: 40px 20px; max-width: 520px; }
  .zero { font-size: clamp(120px, 30vw, 200px); font-weight: 900; line-height: 1; letter-spacing: -0.04em; color: var(--amber-ink); }
  .zero span { display: inline-grid; place-items: center; width: .9em; height: .9em; border: .06em solid currentColor; border-radius: 999px; margin: 0 .04em; font-size: .78em; vertical-align: .08em; }
  h1 { font-size: 28px; font-weight: 900; margin: 14px 0 8px; }
  p { color: var(--muted); margin: 0 0 22px; }
  a { color: var(--amber-ink); font-weight: 800; text-decoration: none; }
  a:hover { text-decoration: underline; }
  nav { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  nav a { padding: 10px 18px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--text); }
  nav a.primary { background: var(--amber); color: #0B0F1A; border-color: transparent; }
</style>
</head>
<body>
<main>
  <div class="zero" aria-hidden="true">4<span>0</span>4</div>
  <h1>Nothing folds here.</h1>
  <p>That page does not exist. Try one of these instead.</p>
  <nav>
    <a class="primary" href="/">Home</a>
    <a href="/support/">Support</a>
    <a href="/privacy/">Privacy</a>
  </nav>
</main>
<script>
  // On GitHub Pages the site lives under /numfold-site/; at numfold.app it lives at the root.
  var m = location.pathname.match(/^\/numfold-site\//);
  if (m) document.querySelectorAll('nav a').forEach(function (a) { a.setAttribute('href', '/numfold-site' + a.getAttribute('href')); });
</script>
</body>
</html>
